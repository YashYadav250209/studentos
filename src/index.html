// in an npm icon package, so each "icon" is just a sized span with an emoji.
// They accept the same size/color/strokeWidth props the rest of the app
// passes them (color is ignored, since emoji carry their own color).
function makeIcon(glyph) {
  return function Icon({ size = 16, style }) {
    return (
      <span
        style={{
          fontSize: size, lineHeight: 1, display: "inline-flex",
          alignItems: "center", justifyContent: "center", flexShrink: 0, ...style,
        }}
      >
        {glyph}
      </span>
    );
  };
}

function computeSubjectProgress(subjectId, topicStatusMap) {
  const topics = ALL_TOPICS.filter((t) => t.subjectId === subjectId);
  if (topics.length === 0) return 0;
  const total = topics.reduce((sum, t) => {
    const status = topicStatusMap[t.id] || "not_started";
    return sum + STATUS[status].weight;
  }, 0);
  return Math.round((total / topics.length) * 100);
}

function computeOverallProgress(topicStatusMap) {
  const subjectIds = Object.keys(SUBJECTS);
  const avg =
    subjectIds.reduce((sum, id) => sum + computeSubjectProgress(id, topicStatusMap), 0) /
    subjectIds.length;
  return Math.round(avg);
}

function minutesFromSessions(sessions, sinceMs) {
  return sessions
    .filter((s) => new Date(s.startedAt).getTime() >= sinceMs)
    .reduce((sum, s) => sum + s.durationSec / 60, 0);
}

function startOfTodayMs() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function startOfWeekMs() {
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? 6 : day - 1);
  d.setDate(d.getDate() - diff);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function formatMinutes(mins) {
  const m = Math.round(mins);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  const rem = m % 60;
  return rem ? `${h}h ${rem}m` : `${h}h`;
}

function localDateKey(d = new Date()) {
  const tzOffset = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tzOffset).toISOString().slice(0, 10);
}

function computeDailyMinutesMap(sessions) {
  const map = {};
  sessions.forEach((s) => {
    const key = localDateKey(new Date(s.startedAt));
    map[key] = (map[key] || 0) + s.durationSec / 60;
  });
  return map;
}

function computeStreak(sessions, goalMinutes) {
  const map = computeDailyMinutesMap(sessions);
  const isQualifying = (key) => (map[key] || 0) >= goalMinutes;

  let cursor = new Date();
  if (!isQualifying(localDateKey(cursor))) {
    cursor = new Date(cursor.getTime() - 86400000);
  }
  let current = 0;
  while (isQualifying(localDateKey(cursor))) {
    current++;
    cursor = new Date(cursor.getTime() - 86400000);
  }

  const qualifyingDates = Object.keys(map).filter(isQualifying).sort();
  let longest = 0, run = 0, prevDate = null;
  qualifyingDates.forEach((dStr) => {
    const d = new Date(dStr + "T00:00:00");
    if (prevDate) {
      const diffDays = Math.round((d - prevDate) / 86400000);
      run = diffDays === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    longest = Math.max(longest, run);
    prevDate = d;
  });
  longest = Math.max(longest, current);
  return { current, longest };
}

function lastNDaysStudy(sessions, n) {
  const map = computeDailyMinutesMap(sessions);
  const days = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const key = localDateKey(d);
    days.push({ key, label: d.toLocaleDateString(undefined, { weekday: "short" }), minutes: map[key] || 0 });
  }
  return days;
}

function lastNWeeksStudy(sessions, n) {
  const weeks = [];
  for (let i = n - 1; i >= 0; i--) {
    const anchor = new Date(Date.now() - i * 7 * 86400000);
    const day = anchor.getDay();
    const diff = day === 0 ? 6 : day - 1;
    const start = new Date(anchor);
    start.setDate(start.getDate() - diff);
    start.setHours(0, 0, 0, 0);
    const end = new Date(start.getTime() + 7 * 86400000);
    const minutes = sessions
      .filter((s) => {
        const t = new Date(s.startedAt).getTime();
        return t >= start.getTime() && t < end.getTime();
      })
      .reduce((sum, s) => sum + s.durationSec / 60, 0);
    weeks.push({ label: start.toLocaleDateString(undefined, { month: "short", day: "numeric" }), minutes });
  }
  return weeks;
}

function pad2(n) {
  return String(n).padStart(2, "0");
}

function formatClock(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${pad2(m)}:${pad2(rem)}`;

function SyllabusView({ topicStatus, onCycleTopic, subjectProgress, overallProgress, t }) {
  const [query, setQuery] = useState("");
  const [subjectFilter, setSubjectFilter] = useState("all");
  const [statusFilter, setStatusFilter] = useState("all");

  const filteredTopics = useMemo(() => {
    return ALL_TOPICS.filter((topic) => {
      if (subjectFilter !== "all" && topic.subjectId !== subjectFilter) return false;
      const status = topicStatus[topic.id] || "not_started";
      if (statusFilter !== "all" && status !== statusFilter) return false;
      if (query.trim() && !topic.name.toLowerCase().includes(query.trim().toLowerCase())) return false;
      return true;
    });
  }, [query, subjectFilter, statusFilter, topicStatus]);

  const groupedBySubject = useMemo(() => {
    const groups = {};
    filteredTopics.forEach((topic) => {
      groups[topic.subjectId] = groups[topic.subjectId] || [];
      groups[topic.subjectId].push(topic);
    });

  }, [filteredTopics]);

  const subjectsToShow = subjectFilter === "all" ? Object.keys(SUBJECTS) : [subjectFilter];

  return (
    <div>
      <div style={{ marginBottom: 18 }}>

          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: t.textMuted }}>
            {overallProgress}% overall · {ALL_TOPICS.length} topics

        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 180, background: t.surface, border: `1px solid ${t.border}`, borderRadius: 9, padding: "8px 12px" }}>
          <Search size={14} color={t.textFaint} />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Search topics…"
            style={{ border: "none", outline: "none", background: "transparent", color: t.text, fontSize: 13, flex: 1, fontFamily: "inherit" }}
          />
          {query && (
            <button onClick={() => setQuery("")} style={{ border: "none", background: "transparent", cursor: "pointer", display: "flex" }}>
              <X size={13} color={t.textFaint} />
            </button>
          )}
        </div>

        <select value={subjectFilter} onChange={(e) => setSubjectFilter(e.target.value)} style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 9, padding: "8px 10px", color: t.text, fontSize: 13, fontFamily: "inherit" }}>
          {SUBJECT_FILTERS.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}

          {STATUS_FILTERS.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
        </select>
      </div>

      {filteredTopics.length === 0 ? (
        <EmptyState title="No topics match" body="Try clearing the search or filters — every JEE topic is loaded, so this is a filter dead-end, not missing data." t={t} />
      ) : (
        subjectsToShow.map((subjectId) => {

                <TopicRow key={topic.id} topic={topic} status={topicStatus[topic.id] || "not_started"} color={subject.color} onCycle={() => onCycleTopic(topic.id)} t={t} />
              ))}
            </div>
          );
        })
      )}
    </div>
  );
}

function TimerView({ onCompleteSession, t }) {
  const [presetId, setPresetId] = useState("25-5");
  const [customMinutes, setCustomMinutes] = useState(30);
  const [subjectId, setSubjectId] = useState("physics");
  const [topicId, setTopicId] = useState(ALL_TOPICS.find((x) => x.subjectId === "physics").id);

  const focusMinutes = useMemo(() => {
    const preset = TIMER_PRESETS.find((p) => p.id === presetId);
    return preset.focusMin ?? customMinutes;
  }, [presetId, customMinutes]);

  const totalSeconds = focusMinutes * 60;

  const [status, setStatus] = useState("idle");
  const [remaining, setRemaining] = useState(totalSeconds);
  const [elapsedAtPause, setElapsedAtPause] = useState(0);
  const [justSaved, setJustSaved] = useState(false);

  useEffect(() => {
    if (status === "idle") {
      setRemaining(totalSeconds);
      setElapsedAtPause(0);
    }
  }, [totalSeconds, status]);

  useEffect(() => {
    if (status !== "running") return;
    const interval = setInterval(() => {
      setRemaining((prev) => {
        if (prev <= 1) {
          clearInterval(interval);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, [status]);

  useEffect(() => {
    if (status === "running" && remaining === 0) {
      finishSession(totalSeconds);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [remaining, status]);

  const topicsForSubject = ALL_TOPICS.filter((tp) => tp.subjectId === subjectId);

  function finishSession(elapsedSeconds) {
    if (elapsedSeconds >= 60) {
      const session = {
        id: `session-${Date.now()}`,
        subjectId, topicId,
        durationSec: elapsedSeconds,
        startedAt: new Date(Date.now() - elapsedSeconds * 1000).toISOString(),
        endedAt: new Date().toISOString(),
        xpEarned: computeSessionXp(elapsedSeconds),
      };
      onCompleteSession(session);
      setJustSaved(true);
      setTimeout(() => setJustSaved(false), 2500);
    }
    setStatus("idle");
    setRemaining(totalSeconds);
    setElapsedAtPause(0);
  }

  function handleStart() { setStatus("running"); }
  function handlePause() { setStatus("paused"); setElapsedAtPause(totalSeconds - remaining); }
  function handleResume() { setStatus("running"); }
  function handleStop() { finishSession(totalSeconds - remaining); }
  function handleReset() { setStatus("idle"); setRemaining(totalSeconds); setElapsedAtPause(0); }

  const pct = Math.round(((totalSeconds - remaining) / totalSeconds) * 100);
  const circumference = 2 * Math.PI * 90;
  const dash = (pct / 100) * circumference;
  const running = status === "running";
  const paused = status === "paused";
  const idle = status === "idle";

  return (
    <div style={{ maxWidth: 620 }}>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 20, fontWeight: 700, marginBottom: 4 }}>Focus Timer</div>
      <div style={{ fontSize: 13, color: t.textMuted, marginBottom: 20 }}>
        Sessions save automatically once you cross a minute — subject, topic, duration and XP are logged.
      </div>

      <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ position: "relative", width: 200, height: 200, flexShrink: 0 }}>
          <svg width={200} height={200} viewBox="0 0 200 200">
            <g transform="rotate(-90 100 100)">
              <circle cx={100} cy={100} r={90} fill="none" stroke={t.border} strokeWidth={10} />
              <circle
                cx={100} cy={100} r={90} fill="none"
                stroke={SUBJECTS[subjectId].color} strokeWidth={10}
                strokeDasharray={`${dash} ${circumference}`} strokeLinecap="round"
                style={{ transition: "stroke-dasharray 0.4s linear" }}
              />
            </g>
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 32, fontWeight: 600, color: t.text }}>
              {formatClock(remaining)}
            </div>
            <div style={{ fontSize: 11.5, color: t.textFaint, marginTop: 2, textTransform: "uppercase", letterSpacing: "0.05em" }}>
              {idle ? "Ready" : running ? "Focusing" : paused ? "Paused" : "Done"}
            </div>
          </div>
        </div>

        <div style={{ flex: 1, minWidth: 240 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            {idle ? (
              <TimerButton label="Start" primary onClick={handleStart} t={t} />
            ) : running ? (
              <>
                <TimerButton label="Pause" onClick={handlePause} t={t} />
                <TimerButton label="Stop" onClick={handleStop} t={t} />
              </>
            ) : (
              <>
                <TimerButton label="Resume" primary onClick={handleResume} t={t} />
                <TimerButton label="Stop" onClick={handleStop} t={t} />
              </>
            )}
            <TimerButton label="Reset" onClick={handleReset} t={t} />
          </div>

          {justSaved && <div style={{ fontSize: 12, color: "#34C77B", marginBottom: 12, fontWeight: 600 }}>Session saved ✓</div>}

          <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
            {TIMER_PRESETS.map((p) => (
              <button
                key={p.id}
                disabled={!idle}
                onClick={() => setPresetId(p.id)}
                style={{
                  padding: "6px 12px", borderRadius: 999, fontSize: 12.5, fontWeight: 600,
                  border: `1px solid ${presetId === p.id ? ACCENT : t.border}`,
                  background: presetId === p.id ? `${ACCENT}1A` : t.surface,
                  color: presetId === p.id ? ACCENT : t.textMuted,
                  cursor: idle ? "pointer" : "not-allowed", opacity: idle ? 1 : 0.6,
                }}
              >
                {p.label}
              </button>
            ))}
          </div>

          {presetId === "custom" && (
            <div style={{ marginBottom: 12, display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 12.5, color: t.textMuted }}>Duration</span>
              <input
                type="number" min={1} max={180} disabled={!idle}
                value={customMinutes}
                onChange={(e) => setCustomMinutes(Math.max(1, Number(e.target.value) || 1))}
                style={{ width: 64, padding: "6px 8px", borderRadius: 7, border: `1px solid ${t.border}`, background: t.surface, color: t.text, fontSize: 13 }}
              />
              <span style={{ fontSize: 12.5, color: t.textFaint }}>min</span>
            </div>
          )}

          <div style={{ display: "flex", gap: 8 }}>
            <select
              value={subjectId} disabled={!idle}
              onChange={(e) => { setSubjectId(e.target.value); setTopicId(ALL_TOPICS.find((x) => x.subjectId === e.target.value).id); }}
              style={{ flex: 1, background: t.surface, border: `1px solid ${t.border}`, borderRadius: 9, padding: "8px 10px", color: t.text, fontSize: 13, fontFamily: "inherit" }}
            >
              {Object.values(SUBJECTS).map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <select
              value={topicId} disabled={!idle}
              onChange={(e) => setTopicId(e.target.value)}
              style={{ flex: 1.4, background: t.surface, border: `1px solid ${t.border}`, borderRadius: 9, padding: "8px 10px", color: t.text, fontSize: 13, fontFamily: "inherit" }}
            >
              {topicsForSubject.map((tp) => <option key={tp.id} value={tp.id}>{tp.name}</option>)}
            </select>
          </div>
        </div>
      </div>
    </div>
  );
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + "T00:00:00").getTime();
  const today = startOfTodayMs();
  return Math.round((target - today) / 86400000);
}

function getTodayKey() {
  const idx = new Date().getDay();
  const map = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const key = map[idx];
  return TIMETABLE_DAYS.includes(key) ? key : null;
}

function getNextClass() {
  const todayKey = getTodayKey();
  const nowLabel = `${pad2(new Date().getHours())}:${pad2(new Date().getMinutes())}`;
  if (todayKey) {
    const upcoming = (TIMETABLE[todayKey] || []).find((p) => p.time > nowLabel);
    if (upcoming) return { ...upcoming, day: "Today" };
  }
  const startIdx = TIMETABLE_DAYS.indexOf(todayKey) + 1;
  for (let i = 0; i < TIMETABLE_DAYS.length; i++) {
    const day = TIMETABLE_DAYS[(startIdx + i) % TIMETABLE_DAYS.length];
    const periods = TIMETABLE[day] || [];
    if (periods.length > 0) return { ...periods[0], day };
  }
  return null;
}

function periodLabel(period) {
  if (period.type === "break") return period.label;
  if (period.type === "mock") return period.label;
  if (period.type === "doubt") return period.label;
  return SUBJECTS[period.subjectId]?.name || "Class";
}

              border: `1px solid ${active ? t.text : t.border}`,
              background: active ? t.text : "transparent",
              color: active ? t.bg : t.textMuted,
              cursor: "pointer",
            }}
          >
            {opt.label}
          </button>
        );
      })}

}

  const nextExam = useMemo(

  const overallAttendancePct = useMemo(() => {

        <StatCard icon={Bell} label="Notices" value={unreadCount} sub={unreadCount > 0 ? "unread" : "all caught up"} accent={unreadCount > 0 ? "#F2635C" : "#34C77B"} t={t} />
      </div>

      <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, padding: 18, marginBottom: 14 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 12 }}>What needs your attention</div>

function StudentOS() {
  const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(DEFAULT_PROFILE);
  const [topicStatus, setTopicStatus] = useState({});
  const [sessions, setSessions] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [readNoticeIds, setReadNoticeIds] = useState([]);
  const [auth, setAuth] = useState(DEFAULT_AUTH);
  const [activeTab, setActiveTab] = useState("dashboard");
  const [publicPage, setPublicPage] = useState("landing");
  const [authMode, setAuthMode] = useState("login");

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [p, ts, s, tk, rn, a] = await Promise.all([
        db.getProfile(), db.getTopicStatus(), db.getSessions(), db.getTasks(), db.getReadNotices(), db.getAuth(),
      ]);
      if (!mounted) return;
      setProfile(p);
      setTopicStatus(ts);
      setSessions(s);
      setTasks(tk);
      setReadNoticeIds(rn);
      setAuth(a);
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, []);

  const toggleTheme = useCallback(() => {
    setProfile((prev) => {
      const next = { ...prev, theme: prev.theme === "dark" ? "light" : "dark" };
      db.saveProfile(next);
      return next;
    });
  }, []);

  const awardXp = useCallback((amount) => {
    setProfile((prev) => {
      const next = { ...prev, xp: prev.xp + amount };
      db.saveProfile(next);
      return next;
    });
  }, []);

  const handleCycleTopic = useCallback((topicId) => {
    setTopicStatus((prev) => {
      const prevStatus = prev[topicId] || "not_started";
      const newStatus = nextStatus(prevStatus);
      const next = { ...prev, [topicId]: newStatus };
      db.saveTopicStatus(next);
      if (newStatus === "completed" && prevStatus !== "completed") {
        awardXp(XP_RULES.topicCompletedBonus);
      }
      return next;
    });
  }, [awardXp]);

  const handleCompleteSession = useCallback((session) => {
    setSessions((prev) => {
      const next = [...prev, session];
      db.saveSessions(next);
      return next;
    });
    awardXp(session.xpEarned);
  }, [awardXp]);

  const handleMarkNoticeRead = useCallback((noticeId) => {
    setReadNoticeIds((prev) => {
      if (prev.includes(noticeId)) return prev;
      const next = [...prev, noticeId];
      db.saveReadNotices(next);
      return next;
    });
  }, []);

  const handleLogin = useCallback((email) => {
    const next = { loggedIn: true, email };
    setAuth(next);
    db.saveAuth(next);
  }, []);

  const handleLogout = useCallback(() => {
    const next = { loggedIn: false, email: null };
    setAuth(next);
    db.saveAuth(next);
  }, []);

  const handleSelectPlan = useCallback((planId) => {
    setProfile((prev) => {
      const next = { ...prev, plan: planId };
      db.saveProfile(next);
      return next;
    });
  }, []);

  const handleAddTask = useCallback(({ subjectId, topicId, estMinutes, priority }) => {
    setTasks((prev) => {
      const next = [...prev, { id: `task-${Date.now()}`, date: localDateKey(), subjectId, topicId, estMinutes, priority, status: "pending" }];
      db.saveTasks(next);
      return next;
    });
  }, []);

  const handleToggleTask = useCallback((taskId) => {
    setTasks((prev) => {
      const next = prev.map((tk) => (tk.id === taskId ? { ...tk, status: tk.status === "done" ? "pending" : "done" } : tk));
      db.saveTasks(next);
      return next;
    });
  }, []);

  const handleDeleteTask = useCallback((taskId) => {
    setTasks((prev) => {
      const next = prev.filter((tk) => tk.id !== taskId);
      db.saveTasks(next);
      return next;
    });
  }, []);

  const handleUpdateDailyGoal = useCallback((minutes) => {
    setProfile((prev) => {
      const next = { ...prev, dailyGoalMinutes: minutes };
      db.saveProfile(next);
      return next;
    });
  }, []);

  const t = THEMES[profile.theme] || THEMES.dark;

  const subjectProgress = useMemo(() => {
    const out = {};
    Object.keys(SUBJECTS).forEach((id) => { out[id] = computeSubjectProgress(id, topicStatus); });
    return out;
  }, [topicStatus]);

  const overallProgress = useMemo(() => computeOverallProgress(topicStatus), [topicStatus]);
  const todayMinutes = useMemo(() => minutesFromSessions(sessions, startOfTodayMs()), [sessions]);
  const weekMinutes = useMemo(() => minutesFromSessions(sessions, startOfWeekMs()), [sessions]);
  const streak = useMemo(() => computeStreak(sessions, profile.dailyGoalMinutes), [sessions, profile.dailyGoalMinutes]);

  useEffect(() => {
    if (loading) return;
    const todayKey = localDateKey();
    if (todayMinutes >= profile.dailyGoalMinutes && profile.lastGoalBonusDate !== todayKey) {
      setProfile((prev) => {
        if (prev.lastGoalBonusDate === todayKey) return prev;
        const next = { ...prev, xp: prev.xp + XP_RULES.dailyGoalBonus, lastGoalBonusDate: todayKey };
        db.saveProfile(next);
        return next;
      });
    }
  }, [todayMinutes, profile.dailyGoalMinutes, profile.lastGoalBonusDate, loading]);

  const todayTasks = useMemo(() => {
    const todayKey = localDateKey();
    return tasks.filter((tk) => tk.date === todayKey);
  }, [tasks]);

  const recentSessions = useMemo(() => [...sessions].sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt)).slice(0, 5), [sessions]);

  if (loading) {
    return (
      <div style={{ background: THEMES.dark.bg, color: THEMES.dark.textMuted, minHeight: 420, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter, system-ui, sans-serif", fontSize: 13.5 }}>
        Loading StudentOS…
      </div>
    );
  }

  if (!auth.loggedIn) {
    if (publicPage === "landing") {
      return <LandingView onEnterAuth={(mode) => { setAuthMode(mode); setPublicPage("auth"); }} t={t} />;
    }
    return <LoginView onLogin={handleLogin} onBack={() => setPublicPage("landing")} initialMode={authMode} t={t} />;
  }

  return (
    <div style={{ background: t.bg, color: t.text, fontFamily: "Inter, system-ui, -apple-system, sans-serif", minHeight: 560, borderRadius: 16, overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 22px", borderBottom: `1px solid ${t.border}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: `linear-gradient(135deg, ${SUBJECTS.physics.color}, ${SUBJECTS.mathematics.color})`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 14, color: "#0F1419" }}>S</div>
          <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 16 }}>StudentOS</span>
          <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.04em", padding: "3px 8px", borderRadius: 999, background: t.surfaceRaised, border: `1px solid ${t.border}`, color: t.textMuted }}>
            {EXAMS[profile.examId].name.toUpperCase()}
          </span>
          <button onClick={() => setActiveTab("subscription")} style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.02em", padding: "3px 9px", borderRadius: 999, border: "none", cursor: "pointer", background: profile.plan === "free" ? t.surfaceRaised : `${ACCENT}1A`, color: profile.plan === "free" ? t.textMuted : ACCENT }}>
            {PLANS.find((p) => p.id === profile.plan)?.name || "Free"} plan
          </button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={toggleTheme} aria-label="Toggle theme" style={{ width: 32, height: 32, borderRadius: 8, border: `1px solid ${t.border}`, background: t.surface, color: t.textMuted, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
            {profile.theme === "dark" ? <Sun size={15} /> : <Moon size={15} />}
          </button>
          <button onClick={handleLogout} aria-label="Log out" title="Log out (demo)" style={{ width: 32, height: 32, borderRadius: 8, border: `1px solid ${t.border}`, background: t.surface, color: t.textMuted, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
            <LogOut size={15} />
          </button>
        </div>
      </div>

      <div style={{ display: "flex", flex: 1, minHeight: 0 }}>
        <div style={{ width: 176, borderRight: `1px solid ${t.border}`, padding: "16px 10px", display: "flex", flexDirection: "column", gap: 2, flexShrink: 0 }}>
          {NAV_ITEMS.map((item) => {
            const active = activeTab === item.id;
            return (
              <button
                key={item.id}
                onClick={() => setActiveTab(item.id)}
                style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 10px", borderRadius: 8, border: "none", background: active ? t.surfaceRaised : "transparent", color: active ? t.text : t.textMuted, fontSize: 13, fontWeight: active ? 600 : 500, cursor: "pointer", textAlign: "left", width: "100%" }}
              >
                <item.icon size={15} strokeWidth={2.1} />
                <span style={{ flex: 1 }}>{item.label}</span>
              </button>
            );
          })}
        </div>

        <div style={{ flex: 1, padding: "22px 24px", overflowY: "auto" }}>
          {activeTab === "institution" ? (
            <InstitutionView readNoticeIds={readNoticeIds} onMarkNoticeRead={handleMarkNoticeRead} t={t} />
          ) : activeTab === "syllabus" ? (
            <SyllabusView topicStatus={topicStatus} onCycleTopic={handleCycleTopic} subjectProgress={subjectProgress} overallProgress={overallProgress} t={t} />
          ) : activeTab === "timer" ? (
            <TimerView onCompleteSession={handleCompleteSession} t={t} />
          ) : activeTab === "plan" ? (
            <PlanView tasks={todayTasks} onAddTask={handleAddTask} onToggleTask={handleToggleTask} onDeleteTask={handleDeleteTask} dailyGoalMinutes={profile.dailyGoalMinutes} onUpdateGoal={handleUpdateDailyGoal} todayMinutes={todayMinutes} t={t} />
          ) : activeTab === "progress" ? (
            <ProgressView subjectProgress={subjectProgress} overallProgress={overallProgress} topicStatus={topicStatus} sessions={sessions} xp={profile.xp} streak={streak} t={t} />
          ) : activeTab === "subscription" ? (
            <SubscriptionView currentPlan={profile.plan} onSelectPlan={handleSelectPlan} t={t} />
          ) : (
            <>
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 20, fontWeight: 700 }}>{greeting()}, {profile.name}.</div>
                <div style={{ fontSize: 13, color: t.textMuted, marginTop: 2 }}>
                  {overallProgress > 0 ? `${overallProgress}% of the JEE syllabus covered so far.` : "Head to Syllabus to start marking topics, or Timer to log your first session."}
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12, marginBottom: 20 }}>
                <StatCard icon={Clock} label="Today" value={formatMinutes(todayMinutes)} sub="study time" accent={ACCENT} t={t} />
                <StatCard icon={CalendarDays} label="This week" value={formatMinutes(weekMinutes)} sub="study time" accent={ACCENT} t={t} />
                <StatCard icon={Flame} label="Streak" value={streak.current} sub={`best: ${streak.longest}`} accent={STREAK_ACCENT} t={t} />
                <StatCard icon={Zap} label="XP" value={profile.xp} sub="total earned" accent={ACCENT} t={t} />
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "minmax(280px, 1fr) minmax(240px, 1fr)", gap: 14 }}>
                <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, padding: 20 }}>
                  <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 16 }}>
                    <span style={{ fontSize: 13.5, fontWeight: 600 }}>Syllabus coverage</span>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: t.textMuted }}>{ALL_TOPICS.length} topics</span>
                  </div>
                  <SubjectRings progress={subjectProgress} t={t} />
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                  <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, padding: 18 }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                      <span style={{ fontSize: 13.5, fontWeight: 600 }}>Today's plan</span>
                      <button onClick={() => setActiveTab("plan")} style={{ border: "none", background: "transparent", cursor: "pointer", display: "flex", padding: 0 }} aria-label="Open Today's Plan">
                        <ChevronRight size={14} color={t.textFaint} />
                      </button>
                    </div>
                    {todayTasks.length === 0 ? (
                      <EmptyState title="Nothing planned yet" body="Add a subject and topic from Today's Plan to line up your study session." t={t} />
                    ) : (
                      todayTasks.slice(0, 4).map((tk) => <TaskRow key={tk.id} task={tk} onToggle={handleToggleTask} onDelete={handleDeleteTask} t={t} />)
                    )}
                  </div>

                  <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, padding: 18 }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                      <span style={{ fontSize: 13.5, fontWeight: 600 }}>Recent sessions</span>
                      <button onClick={() => setActiveTab("timer")} style={{ border: "none", background: "transparent", cursor: "pointer", display: "flex", padding: 0 }} aria-label="Open Timer">
                        <ChevronRight size={14} color={t.textFaint} />
                      </button>
                    </div>
                    {recentSessions.length === 0 ? (
                      <EmptyState title="No sessions logged" body="Run a focus session from the Timer tab — it'll show up here with subject, duration and XP." t={t} />
                    ) : (
                      recentSessions.map((s) => {
                        const subject = SUBJECTS[s.subjectId];
                        const topic = ALL_TOPICS.find((tp) => tp.id === s.topicId);
                        return (
                          <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: `1px solid ${t.border}` }}>
                            <span style={{ width: 8, height: 8, borderRadius: "50%", background: subject.color, flexShrink: 0 }} />
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontSize: 12.5, color: t.text, fontWeight: 500 }}>{topic ? topic.name : subject.name}</div>
                              <div style={{ fontSize: 11, color: t.textFaint }}>{new Date(s.startedAt).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</div>
                            </div>
                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: t.textMuted }}>{formatMinutes(s.durationSec / 60)}</span>
                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: ACCENT }}>+{s.xpEarned}</span>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return "Still up";
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  if (h < 21) return "Good evening";
  return "Good night";
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<StudentOS />);
</script>
</body>
</html>
